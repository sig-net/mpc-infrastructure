apiVersion: v1
kind: Namespace
metadata:
  name: chain-signatures-testnet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multichain-testnet
  namespace: chain-signatures-testnet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multichain-testnet-0-config
  namespace: chain-signatures-testnet
data:
  PARTICIPANT_NAME: multichain-testnet-0
  MPC_NODE_ID: "0"
  MPC_ENV: testnet
  MPC_ACCOUNT_ID: <your-near-account-id>
  MPC_LOCAL_ADDRESS: http://multichain-testnet-0.multichain-testnet.chain-signatures-testnet.svc.cluster.local:3000
  MPC_NEAR_RPC: https://rpc.testnet.fastnear.com
  MPC_CONTRACT_ID: v1.sig-net.testnet
  MPC_INDEXER_S3_BUCKET: near-lake-data-testnet
  MPC_INDEXER_S3_REGION: eu-central-1
  AWS_DEFAULT_REGION: eu-central-1
  MPC_WEB_PORT: "3000"
  RUST_LOG: mpc_node=debug
  MPC_ETH_CONTRACT_ADDRESS: 83458E8Bf8206131Fe5c05127007FA164c0948A2
  MPC_SOL_PROGRAM_ADDRESS: SigTVbfRK9LsXWpSv9KgpabrQcFKr5hDdUwMhYsXyKg
  MPC_HYDRATION_RPC_WS_URL: wss://node.lark.hydration.cloud
  MPC_HYDRATION_SIGNER_URI: //Bob
  MPC_REDIS_URL: redis://redis.chain-signatures-testnet.svc.cluster.local:6379
---
apiVersion: v1
kind: Service
metadata:
  name: multichain-testnet
  namespace: chain-signatures-testnet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: multichain
    app.kubernetes.io/instance: multichain-testnet
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: multichain-testnet-http
  namespace: chain-signatures-testnet
spec:
  selector:
    app.kubernetes.io/name: multichain
    app.kubernetes.io/instance: multichain-testnet
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: multichain-testnet
  namespace: chain-signatures-testnet
spec:
  serviceName: multichain-testnet
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multichain
      app.kubernetes.io/instance: multichain-testnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multichain
        app.kubernetes.io/instance: multichain-testnet
    spec:
      serviceAccountName: multichain-testnet
      containers:
        - name: multichain
          image: europe-west1-docker.pkg.dev/near-cs-testnet/multichain-public/multichain-testnet@sha256:<replace-with-release-digest>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: multichain-testnet-0-config
            - secretRef:
                name: multichain-testnet-0-secrets
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
