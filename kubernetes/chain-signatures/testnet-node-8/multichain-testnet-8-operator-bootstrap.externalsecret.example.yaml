apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multichain-testnet-8-operator-bootstrap
  namespace: chain-sig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gsm-secret-store
  target:
    name: multichain-testnet-8-operator-bootstrap
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        bootstrap.env: |
          PARTICIPANT_NAME=multichain-testnet-8
          MPC_NODE_ID=8
          MPC_LOCAL_ADDRESS=http://35.187.119.120:3000
          MPC_ENV=testnet
          MPC_GCP_PROJECT_ID=near-cs-testnet
          MPC_ACCOUNT_ID=multichain-node-8.testnet
          MPC_WEB_PORT=3000
          MPC_CIPHER_PK=bd721c2cf0c3f3ef9429726e2a658e72714587367b40449739cb3a35994d692a
          MPC_ACCOUNT_SK={{ .MPC_ACCOUNT_SK }}
          MPC_CIPHER_SK={{ .MPC_CIPHER_SK }}
          MPC_SIGN_SK={{ .MPC_SIGN_SK }}
          AWS_ACCESS_KEY_ID={{ .AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY={{ .AWS_SECRET_ACCESS_KEY }}
          MPC_SK_SHARE_SECRET_ID=multichain-sk-share-testnet-8
          MPC_ETH_ACCOUNT_SK={{ .MPC_ETH_ACCOUNT_SK }}
          MPC_SOL_ACCOUNT_SK={{ .MPC_SOL_ACCOUNT_SK }}
          MANIFEST_URL=https://storage.googleapis.com/chain-signatures-testnet/channels/stable/manifest.json
          MANIFEST_CHANNEL=testnet-stable
          MANIFEST_IMPLEMENTATION=k8s
          TRUSTED_MANIFEST_PUBKEY=KaVGVJVvFyYnTeDOcXjIY+IMXzCLXkElVjI8L0Aef9I=
          DOCKER_CONTAINER_NAME=multichain
          K8S_NAMESPACE=chain-sig
          K8S_WORKLOAD_KIND=Deployment
          K8S_WORKLOAD_NAME=multichain-testnet-8
          K8S_CONTAINER_NAME=multichain-8
          POLL_INTERVAL_SECONDS=300
  data:
    - secretKey: MPC_ACCOUNT_SK
      remoteRef:
        key: multichain-account-sk-testnet-8
    - secretKey: MPC_CIPHER_SK
      remoteRef:
        key: multichain-cipher-sk-testnet-8
    - secretKey: MPC_SIGN_SK
      remoteRef:
        key: multichain-sign-sk-testnet-8
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: multichain-indexer-aws-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: multichain-indexer-aws-secret-key
    - secretKey: MPC_ETH_ACCOUNT_SK
      remoteRef:
        key: multichain-eth-account-sk-testnet-8
    - secretKey: MPC_SOL_ACCOUNT_SK
      remoteRef:
        key: multichain-sol-account-sk-testnet
