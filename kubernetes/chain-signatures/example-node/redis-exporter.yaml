apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: chain-sig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.67.0
          env:
            - name: REDIS_ADDR
              value: redis://redis.chain-sig.svc.cluster.local:6379
          ports:
            - containerPort: 9121
              name: exporter-port
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: chain-sig
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: exporter-port
      protocol: TCP
