apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multichain-node-secrets
  namespace: chain-sig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gsm-secret-store
  target:
    name: multichain-node-secrets
    creationPolicy: Owner
  data:
    - secretKey: MPC_ACCOUNT_SK
      remoteRef:
        key: multichain-account-sk-example-0
    - secretKey: MPC_CIPHER_SK
      remoteRef:
        key: multichain-cipher-sk-example-0
    - secretKey: MPC_SIGN_SK
      remoteRef:
        key: multichain-sign-sk-example-0
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: multichain-indexer-aws-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: multichain-indexer-aws-secret-key
    - secretKey: MPC_ETH_ACCOUNT_SK
      remoteRef:
        key: multichain-eth-account-sk-example-0
    - secretKey: MPC_ETH_EXECUTION_RPC_HTTP_URL
      remoteRef:
        key: multichain-eth-execution-rpc-url-example
    - secretKey: MPC_ETH_CONSENSUS_RPC_HTTP_URL
      remoteRef:
        key: multichain-eth-consensus-rpc-url-example
    - secretKey: MPC_SOL_ACCOUNT_SK
      remoteRef:
        key: multichain-sol-account-sk-example
    - secretKey: MPC_SOL_RPC_HTTP_URL
      remoteRef:
        key: multichain-sol-rpc-http-url-example
    - secretKey: MPC_SOL_RPC_WS_URL
      remoteRef:
        key: multichain-sol-rpc-ws-url-example
    - secretKey: MPC_CANTON_OIDC_TOKEN_URL
      remoteRef:
        key: multichain-canton-oidc-token-url-example
    - secretKey: MPC_CANTON_OIDC_CLIENT_ID
      remoteRef:
        key: multichain-canton-oidc-client-id-example
    - secretKey: MPC_CANTON_OIDC_CLIENT_SECRET
      remoteRef:
        key: multichain-canton-oidc-client-secret-example
    - secretKey: MPC_CANTON_OIDC_AUDIENCE
      remoteRef:
        key: multichain-canton-oidc-audience-example
