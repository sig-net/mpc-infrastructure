apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multichain-node-operator-bootstrap
  namespace: chain-sig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gsm-secret-store
  target:
    name: multichain-node-operator-bootstrap
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        bootstrap.env: |
          PARTICIPANT_NAME=multichain-node
          MPC_NODE_ID=0
          MPC_LOCAL_ADDRESS=https://multichain-node.example.net
          MPC_ENV=example
          MPC_GCP_PROJECT_ID=example-project
          MPC_ACCOUNT_ID=multichain-node.example
          MPC_WEB_PORT=3000
          MPC_CIPHER_PK=<cipher-public-key>
          MPC_ACCOUNT_SK={{ .MPC_ACCOUNT_SK }}
          MPC_CIPHER_SK={{ .MPC_CIPHER_SK }}
          MPC_SIGN_SK={{ .MPC_SIGN_SK }}
          AWS_ACCESS_KEY_ID={{ .AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY={{ .AWS_SECRET_ACCESS_KEY }}
          MPC_SK_SHARE_SECRET_ID=multichain-sk-share-example-0
          MPC_ETH_ACCOUNT_SK={{ .MPC_ETH_ACCOUNT_SK }}
          MPC_SOL_ACCOUNT_SK={{ .MPC_SOL_ACCOUNT_SK }}
          MANIFEST_URL=https://storage.googleapis.com/example-bucket/channels/stable/manifest.json
          MANIFEST_CHANNEL=stable
          MANIFEST_IMPLEMENTATION=k8s
          TRUSTED_MANIFEST_PUBKEY=<trusted-manifest-pubkey>
          DOCKER_CONTAINER_NAME=multichain
          K8S_NAMESPACE=chain-sig
          K8S_WORKLOAD_KIND=Deployment
          K8S_WORKLOAD_NAME=multichain-node
          K8S_CONTAINER_NAME=multichain-node
          POLL_INTERVAL_SECONDS=300
  data:
    - secretKey: MPC_ACCOUNT_SK
      remoteRef:
        key: multichain-account-sk-example-0
    - secretKey: MPC_CIPHER_SK
      remoteRef:
        key: multichain-cipher-sk-example-0
    - secretKey: MPC_SIGN_SK
      remoteRef:
        key: multichain-sign-sk-example-0
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: multichain-indexer-aws-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: multichain-indexer-aws-secret-key
    - secretKey: MPC_ETH_ACCOUNT_SK
      remoteRef:
        key: multichain-eth-account-sk-example-0
    - secretKey: MPC_SOL_ACCOUNT_SK
      remoteRef:
        key: multichain-sol-account-sk-example
