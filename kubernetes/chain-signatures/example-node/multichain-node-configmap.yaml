  MPC_REDIS_URL: redis://redis.chain-sig.svc.cluster.local:6379
  MPC_ETH_CONTRACT_ADDRESS: <evm-contract-address>
  MPC_SOL_PROGRAM_ADDRESS: <solana-program-address>
  MPC_CANTON_JSON_API_URL: https://ledger.example.net
  MPC_CANTON_JSON_API_WS_URL: wss://ledger.example.net
  MPC_CANTON_LEDGER_API_USER: <ledger-api-user>
  MPC_CANTON_OIDC_SCOPE: daml_ledger_api
  MPC_CANTON_PARTY_ID: <canton-party-id>
  MPC_CANTON_SIGNER_CONTRACT_ID: <signer-contract-id>
  MPC_CANTON_SIGNER_TEMPLATE_ID: "#signet-signer-v1:Signer:Signer"
