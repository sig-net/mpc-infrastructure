apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multichain-node-operator
  namespace: chain-sig
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multichain-node-operator
  namespace: chain-sig
subjects:
  - kind: ServiceAccount
    name: k8s-sa
    namespace: chain-sig
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: multichain-node-operator
